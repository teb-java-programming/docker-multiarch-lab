services:
  tomcat:
    build:
      context: ..
      dockerfile: core/docker/tomcat/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/orclpdb1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      IBM_MQ_CONN_NAME: ibm-mq(1414)
      VALIDATION_SERVICE_BASE_URL: http://wiremock:8080

  kafka:
    image: theencodedbong/kafka:3.9.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  wiremock:
    image: theencodedbong/wiremock:3.13.2
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock

  oracle:
    image: theencodedbong/oracle:19.3.0
    environment:
      ORACLE_PWD: Oracl3124
    ports:
      - "1521:1521"

  ibm-mq:
    image: theencodedbong/ibm-mq:9.4.5.1
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: passw0rd
    ports:
      - "1414:1414"
      - "9443:9443"