name: Oracle AMD64 Download Check

'on':
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Oracle download URL
        run: |
          curl -I -L \
            --max-time 60 \
            "https://download.oracle.com/otn/linux/oracle19c/190000/LINUX.X64_193000_db_home.zip"