name: AMD64 Environment Check

on:
  workflow_dispatch:

jobs:
  amd64-check:
    runs-on: ubuntu-latest

    steps:
      - name: System information
        run: |
          echo "Architecture:"
          uname -m

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Docker:"
          docker version --format '{{.Server.Version}}'

          echo
          echo "Docker architecture:"
          docker info --format '{{.Architecture}}'