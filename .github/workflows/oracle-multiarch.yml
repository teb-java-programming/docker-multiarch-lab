name: Create Oracle Multi-Architecture Image

'on':
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: container-registry.oracle.com
          username: ${{ secrets.ORACLE_REGISTRY_USERNAME }}
          password: ${{ secrets.ORACLE_REGISTRY_TOKEN }}

      - name: Create multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag theencodedbong/oracle:19.3.0 \
            theencodedbong/oracle:19.3.0 \
            container-registry.oracle.com/database/enterprise:19.3.0.0

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect \
            theencodedbong/oracle:19.3.0