name: Validate Official Oracle AMD64

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Show runner architecture
        run: |
          uname -m
          docker info --format '{{.Architecture}}'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Log in to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: container-registry.oracle.com
          username: ${{ secrets.ORACLE_REGISTRY_USERNAME }}
          password: ${{ secrets.ORACLE_REGISTRY_TOKEN }}

      - name: Pull official Oracle image
        run: |
          docker pull \
            --platform linux/amd64 \
            container-registry.oracle.com/database/enterprise:19.3.0.0

      - name: Verify image architecture
        run: |
          docker image inspect \
            container-registry.oracle.com/database/enterprise:19.3.0.0 \
            --format '{{.Architecture}}'

      - name: Start Oracle
        run: |
          docker run -d \
            --name oracle-official-amd64-test \
            --platform linux/amd64 \
            -e ORACLE_PWD=Oracl3124 \
            -p 1521:1521 \
            -p 5500:5500 \
            container-registry.oracle.com/database/enterprise:19.3.0.0

      - name: Wait for Oracle
        run: |
          for i in {1..90}; do
            if docker logs oracle-official-amd64-test 2>&1 | grep -q "DATABASE IS READY TO USE"; then
              exit 0
            fi

            sleep 10
          done

          docker logs oracle-official-amd64-test
          exit 1

      - name: Verify Oracle version and edition
        run: |
          docker exec \
            -e ORACLE_SID=ORCLCDB \
            oracle-official-amd64-test \
            bash -c "printf '%s\n' 'select banner from v\$version;' | sqlplus -s / as sysdba"

      - name: Verify ORCLPDB1
        run: |
          docker exec \
            -e ORACLE_SID=ORCLCDB \
            oracle-official-amd64-test \
            bash -c "printf '%s\n' \"select name, open_mode from v\\\$pdbs where name = 'ORCLPDB1';\" | sqlplus -s / as sysdba"

      - name: Verify port 1521
        run: |
          docker exec oracle-official-amd64-test \
            bash -c "echo > /dev/tcp/127.0.0.1/1521"

      - name: Verify SYSTEM login to ORCLPDB1
        run: |
          docker exec \
            -e ORACLE_SID=ORCLCDB \
            oracle-official-amd64-test \
            bash -c "printf '%s\n' 'select sys_context('\''USERENV'\'','\''DB_NAME'\'') from dual;' | sqlplus -s system/Oracl3124@ORCLPDB1"

      - name: Download Oracle JDBC driver
        run: |
          curl -fL \
            -o ojdbc11.jar \
            https://repo1.maven.org/maven2/com/oracle/database/jdbc/ojdbc11/23.4.0.24.05/ojdbc11-23.4.0.24.05.jar

      - name: Create JDBC test
        run: |
          cat > OracleJdbcTest.java <<'EOF'
          import java.sql.Connection;
          import java.sql.DriverManager;
          import java.sql.ResultSet;
          import java.sql.Statement;

          public class OracleJdbcTest {
              public static void main(String[] args) throws Exception {
                  String url = "jdbc:oracle:thin:@localhost:1521/orclpdb1";

                  try (Connection connection =
                           DriverManager.getConnection(url, "system", "Oracl3124");
                       Statement statement = connection.createStatement();
                       ResultSet resultSet =
                           statement.executeQuery("select sys_context('USERENV','DB_NAME') from dual")) {

                      if (resultSet.next()) {
                          System.out.println("DATABASE=" + resultSet.getString(1));
                      }
                  }
              }
          }
          EOF

      - name: Compile JDBC test
        run: |
          javac -cp ojdbc11.jar OracleJdbcTest.java

      - name: Run JDBC test
        run: |
          java -cp .:ojdbc11.jar OracleJdbcTest

      - name: Show Oracle logs
        if: always()
        run: docker logs oracle-official-amd64-test

      - name: Stop Oracle
        if: always()
        run: docker rm -f oracle-official-amd64-test