name: Validate Full Stack AMD64

'on':
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          uname -m
          docker info --format '{{.Architecture}}'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build service
        run: |
          mvn -pl service clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: container-registry.oracle.com
          username: ${{ secrets.ORACLE_REGISTRY_USERNAME }}
          password: ${{ secrets.ORACLE_REGISTRY_TOKEN }}

      - name: Build Tomcat AMD64 application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/docker/tomcat/Dockerfile
          platforms: linux/amd64
          load: true
          tags: multiarch-lab/tomcat:amd64

      - name: Create temporary AMD64 Compose file
        run: |
          cat > /tmp/docker-compose-amd64.yml <<'EOF'
          services:
            tomcat:
              image: multiarch-lab/tomcat:amd64
              platform: linux/amd64
              ports:
                - "8080:8080"
              environment:
                SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/orclpdb1
                SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
                IBM_MQ_CONN_NAME: ibm-mq(1414)
                VALIDATION_SERVICE_BASE_URL: http://wiremock:8080

            kafka:
              image: theencodedbong/kafka:3.9.2
              platform: linux/amd64
              ports:
                - "9092:9092"
              environment:
                KAFKA_PROCESS_ROLES: broker,controller
                KAFKA_NODE_ID: 1
                KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
                KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
                KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
                KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
                KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
                KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
                KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
                KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
                KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

            wiremock:
              image: theencodedbong/wiremock:3.13.2-amd64
              platform: linux/amd64
              ports:
                - "8081:8080"
              volumes:
                - ${GITHUB_WORKSPACE}/core/wiremock:/home/wiremock:ro

            oracle:
              image: container-registry.oracle.com/database/enterprise:19.3.0.0
              platform: linux/amd64
              environment:
                ORACLE_PWD: Oracl3124
              ports:
                - "1521:1521"
                - "5500:5500"

            ibm-mq:
              image: theencodedbong/ibm-mq:9.4.5.1-amd64
              platform: linux/amd64
              environment:
                LICENSE: accept
                MQ_QMGR_NAME: QM1
                MQ_APP_PASSWORD: passw0rd
              ports:
                - "1414:1414"
                - "9443:9443"
          EOF

      - name: Start Oracle
        run: |
          docker compose \
            -f /tmp/docker-compose-amd64.yml \
            up -d oracle

      - name: Wait for Oracle
        run: |
          for i in {1..90}; do
            if docker logs $(docker compose -f /tmp/docker-compose-amd64.yml ps -q oracle) 2>&1 \
              | grep -q "DATABASE IS READY TO USE"; then
              echo "Oracle is ready."
              exit 0
            fi
            sleep 10
          done

          docker compose -f /tmp/docker-compose-amd64.yml logs oracle
          exit 1

      - name: Start Kafka, WireMock and IBM MQ
        run: |
          docker compose \
            -f /tmp/docker-compose-amd64.yml \
            up -d kafka wiremock ibm-mq

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if docker logs $(docker compose -f /tmp/docker-compose-amd64.yml ps -q kafka) 2>&1 \
              | grep -q "Kafka Server started"; then
              echo "Kafka is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose -f /tmp/docker-compose-amd64.yml logs kafka
          exit 1

      - name: Wait for WireMock
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8081/__admin/health \
              | grep -q '^200$'; then
              echo "WireMock is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose -f /tmp/docker-compose-amd64.yml logs wiremock
          exit 1

      - name: Wait for IBM MQ
        run: |
          for i in {1..60}; do
            if docker exec \
              $(docker compose -f /tmp/docker-compose-amd64.yml ps -q ibm-mq) \
              dspmq -m QM1 -o status 2>/dev/null \
              | grep -q 'STATUS(Running)'; then
              echo "IBM MQ is ready."
              exit 0
            fi
            sleep 5
          done

          docker compose -f /tmp/docker-compose-amd64.yml logs ibm-mq
          exit 1

      - name: Start Tomcat
        run: |
          docker compose \
            -f /tmp/docker-compose-amd64.yml \
            up -d tomcat

      - name: Wait for application
        run: |
          for i in {1..60}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/api/orders/999999)

            if [ "$response" = "404" ]; then
              echo "Application is ready."
              exit 0
            fi

            sleep 2
          done

          docker compose -f /tmp/docker-compose-amd64.yml logs tomcat
          exit 1

      - name: Verify valid order
        run: |
          response=$(curl -s -o /tmp/order-response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "customerId": "CUST-123",
              "productId": "PROD-123",
              "quantity": 2
            }' \
            http://localhost:8080/api/orders)

          echo "HTTP status: $response"
          cat /tmp/order-response.json

          if [ "$response" != "201" ]; then
            exit 1
          fi

          order_id=$(sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p' /tmp/order-response.json)

          if [ -z "$order_id" ]; then
            echo "Could not extract order ID."
            exit 1
          fi

          echo "ORDER_ID=$order_id" >> "$GITHUB_ENV"

      - name: Verify GET order
        run: |
          response=$(curl -s -o /tmp/get-order-response.json -w "%{http_code}" \
            http://localhost:8080/api/orders/${ORDER_ID})

          echo "HTTP status: $response"
          cat /tmp/get-order-response.json

          if [ "$response" != "200" ]; then
            exit 1
          fi

      - name: Verify invalid quantity
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "customerId": "CUST-123",
              "productId": "PROD-123",
              "quantity": 0
            }' \
            http://localhost:8080/api/orders)

          echo "HTTP status: $response"

          if [ "$response" != "400" ]; then
            exit 1
          fi

      - name: Verify external validation rejection
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "customerId": "CUST-999",
              "productId": "PROD-999",
              "quantity": 1
            }' \
            http://localhost:8080/api/orders)

          echo "HTTP status: $response"

          if [ "$response" != "400" ]; then
            exit 1
          fi

      - name: Verify Kafka event
        run: |
          kafka_container=$(docker compose \
            -f /tmp/docker-compose-amd64.yml \
            ps -q kafka)

          docker exec "$kafka_container" \
            /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:29092 \
            --topic orders \
            --from-beginning \
            --max-messages 1 \
            --timeout-ms 10000 \
            > /tmp/kafka-event.json

          cat /tmp/kafka-event.json

          grep -q '"customerId":"CUST-123"' /tmp/kafka-event.json
          grep -q '"productId":"PROD-123"' /tmp/kafka-event.json

      - name: Verify IBM MQ message
        run: |
          mq_container=$(docker compose \
            -f /tmp/docker-compose-amd64.yml \
            ps -q ibm-mq)

          depth=$(docker exec "$mq_container" \
            bash -c "printf '%s\n' 'DISPLAY QLOCAL(DEV.QUEUE.1) CURDEPTH' | runmqsc QM1" \
            | sed -n 's/.*CURDEPTH(\([0-9][0-9]*\)).*/\1/p' \
            | tail -1)

          echo "DEV.QUEUE.1 depth: $depth"

          if [ -z "$depth" ] || [ "$depth" -lt 1 ]; then
            echo "Expected at least one message on DEV.QUEUE.1."
            exit 1
          fi

      - name: Show stack logs
        if: always()
        run: |
          docker compose \
            -f /tmp/docker-compose-amd64.yml \
            logs

      - name: Stop stack
        if: always()
        run: |
          docker compose \
            -f /tmp/docker-compose-amd64.yml \
            down -v