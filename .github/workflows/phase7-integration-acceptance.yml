name: Phase 7 Integration and Acceptance

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: |
          uname -m
          docker info --format '{{.Architecture}}'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build service WAR
        run: |
          mvn -pl service clean package -DskipTests

      - name: Start infrastructure
        working-directory: core
        run: |
          docker compose up -d

      - name: Show Compose status
        working-directory: core
        run: |
          docker compose ps

      - name: Wait for Oracle
        working-directory: core
        run: |
          for i in {1..90}; do
            if docker compose logs oracle 2>&1 | grep -q "DATABASE IS READY TO USE"; then
              exit 0
            fi
            sleep 10
          done

          docker compose logs oracle
          exit 1

      - name: Wait for Kafka
        working-directory: core
        run: |
          for i in {1..60}; do
            if docker compose logs kafka 2>&1 | grep -q "Kafka Server started"; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs kafka
          exit 1

      - name: Wait for WireMock
        run: |
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8081/__admin/health \
              | grep -q '^200$'; then
              exit 0
            fi
            sleep 2
          done

          docker compose -f core/docker-compose.yml logs wiremock
          exit 1

      - name: Wait for IBM MQ
        working-directory: core
        run: |
          for i in {1..60}; do
            if docker compose exec -T ibm-mq \
              dspmq 2>/dev/null | grep -q "QMNAME(QM1).*STATUS(Running)"; then
              exit 0
            fi
            sleep 2
          done

          docker compose logs ibm-mq
          exit 1

      - name: Run integration and acceptance tests
        run: |
          mvn -pl service test

      - name: Wait for Tomcat application
        run: |
          for i in {1..60}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/service/api/orders/999999999)

            if [ "$response" = "404" ]; then
              exit 0
            fi

            sleep 2
          done

          docker compose -f core/docker-compose.yml logs tomcat
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install --global newman

      - name: Run Postman API collection
        run: |
          newman run \
            postman/docker-multiarch-lab.postman_collection.json \
            --reporters cli

      - name: Show application logs
        if: always()
        working-directory: core
        run: |
          docker compose logs tomcat

      - name: Show infrastructure logs
        if: always()
        working-directory: core
        run: |
          docker compose logs oracle kafka wiremock ibm-mq

      - name: Stop Compose stack
        if: always()
        working-directory: core
        run: |
          docker compose down -v