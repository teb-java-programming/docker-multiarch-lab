name: Publish WireMock AMD64

'on':
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push WireMock AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/docker/wiremock/Dockerfile
          platforms: linux/amd64
          push: true
          tags: theencodedbong/wiremock:3.13.2-amd64

      - name: Verify published AMD64 image
        run: |
          docker buildx imagetools inspect \
            theencodedbong/wiremock:3.13.2-amd64