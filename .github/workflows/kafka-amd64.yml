name: Build Kafka AMD64

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create AMD64 Dockerfile
        run: |
          cat > /tmp/Dockerfile.kafka-amd64 <<'EOF'
          FROM apache/kafka:3.9.2
          EOF

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: /tmp/Dockerfile.kafka-amd64
          platforms: linux/amd64
          push: true
          tags: theencodedbong/kafka:3.9.2-amd64

      - name: Verify AMD64 image
        run: |
          docker buildx imagetools inspect \
            theencodedbong/kafka:3.9.2-amd64