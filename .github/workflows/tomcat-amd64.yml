name: Build Tomcat AMD64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build service
        run: mvn -pl service clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create AMD64 Dockerfile
        run: |
          cat > /tmp/Dockerfile.tomcat-amd64 <<'EOF'
          FROM tomcat:10.1-jdk21
          COPY service/target/service.war /usr/local/tomcat/webapps/service.war
          EOF

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: /tmp/Dockerfile.tomcat-amd64
          platforms: linux/amd64
          push: true
          tags: theencodedbong/tomcat:10.1-jdk21-amd64